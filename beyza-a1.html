<!DOCTYPE html>
<!-- Bu dosya otomatik üretilir, elle düzenleme: node scripts/build-standalone.js -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beyza'nın A1 Bahçesi</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="A1 Bahçe">
<meta name="theme-color" content="#2340E6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --cobalt:#2340E6; --cobalt-deep:#1A2FB0; --sky:#CFEAFB; --sky-soft:#EAF6FD;
  --meadow:#1E7F5C; --meadow-dark:#145C42; --mint:#9FE0BC;
  --sun:#F7D23E; --poppy:#EE3B24; --paper:#FFFFFF; --ink:#1B1B2B; --muted:#55607A;
  --der:var(--cobalt); --die:var(--poppy); --das:var(--meadow);
  --hand:"Caveat","Comic Sans MS",cursive;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A33; --ink:#F1F3FF; --muted:#A9B2D6; --sky:#24306B; --sky-soft:#1A2350;
    --der:#7C90FF; --die:#FF7A63; --das:#4CC796;
  }
}
:root[data-theme="dark"]{
  --paper:#141A33; --ink:#F1F3FF; --muted:#A9B2D6; --sky:#24306B; --sky-soft:#1A2350;
  --der:#7C90FF; --die:#FF7A63; --das:#4CC796;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--sky-soft);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:8px}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#9FD3F5 0%,var(--sky) 55%,#E8F6FF 100%);padding:28px 20px 0;color:#1B1B2B}
.hero-inner{max-width:880px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:18px;align-items:center;position:relative;z-index:2}
@media (min-width:760px){.hero-inner{grid-template-columns:1.1fr .9fr}}
.hello{font-family:var(--hand);font-weight:700;font-size:clamp(56px,13vw,96px);line-height:.9;margin:0;color:var(--cobalt);letter-spacing:-.5px}
.hello small{display:block;font-size:.42em;color:#1B1B2B;font-weight:600;margin-top:10px;line-height:1.1}
.hero p{max-width:34ch;margin:14px 0 0;font-size:17px}
.frame{position:relative;justify-self:center;width:min(300px,78vw);transform:rotate(3deg);background:#fff;padding:10px 10px 34px;box-shadow:0 10px 24px rgba(26,47,176,.22)}
.frame img{display:block;width:100%;height:auto}
.frame figcaption{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:var(--hand);font-size:24px;color:var(--cobalt)}
.tape{position:absolute;width:70px;height:22px;background:rgba(247,210,62,.85);top:-10px;transform:rotate(-8deg)}
.tape.l{left:-14px}.tape.r{right:-14px;transform:rotate(10deg)}
.cloud{position:absolute;z-index:1;fill:#fff}
.eye{position:absolute;z-index:1}
.land{display:block;width:100%;height:auto;margin-top:-10px;position:relative;z-index:1}
.sails{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sails{animation:none}.card-inner{transition:none!important}}

/* ---------- Main ---------- */
main{max-width:720px;margin:0 auto;padding:0 16px 48px}
.progress{background:var(--meadow);color:#fff;margin:0 -16px;padding:14px 20px 18px}
.progress-row{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.progress strong{font-family:var(--hand);font-size:30px;font-weight:700}
.bar{max-width:720px;margin:8px auto 0;height:14px;background:var(--meadow-dark);border-radius:20px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--mint) 0 14px,#C9F0DA 14px 20px);border-radius:20px;transition:width .5s}

.tabs{display:flex;gap:10px;margin:22px 0 16px;flex-wrap:wrap}
.tab{border:2.5px solid var(--cobalt);background:var(--paper);color:var(--cobalt);padding:6px 14px;border-radius:999px;font-family:var(--hand);font-size:24px;font-weight:700;line-height:1.1}
.tab[aria-selected="true"]{background:var(--cobalt);color:#fff}
.lessons-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.lesson-card{display:block;text-align:left;background:var(--paper);color:var(--ink);border:2px solid var(--sky);border-radius:16px;padding:12px;font:inherit}
.lesson-card.is-done{border-color:var(--meadow)}
.lesson-card-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lesson-card-top strong{font-family:var(--hand);font-size:23px;color:var(--cobalt)}
.lesson-card-label{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.lesson-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.lesson-action{border:1.5px solid var(--cobalt);border-radius:10px;padding:7px 4px;background:var(--paper);color:var(--cobalt);font:inherit;font-size:14px;font-weight:700}
.lesson-quiz{background:var(--cobalt);color:#fff}
.lesson-mini-bar{display:block;height:8px;margin-top:8px;border-radius:10px;background:var(--sky-soft);overflow:hidden}
.lesson-mini-bar span{display:block;height:100%;background:var(--meadow);border-radius:inherit;transition:width .3s}
.lesson-card-status{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-family:var(--hand);font-size:21px;color:var(--cobalt)}
.lesson-back{border:0;background:none;color:var(--muted);text-decoration:underline;font:inherit;font-size:16px}
.lesson-complete{text-align:center;margin:0 0 12px;color:var(--meadow);font-weight:700}

.stage{background:var(--paper);border:2.5px solid var(--cobalt);border-radius:22px 26px 20px 28px;padding:22px 18px;position:relative}
.hint{color:var(--muted);margin:0 0 14px;font-size:15px}

/* flashcard */
.card{perspective:1200px;cursor:pointer;margin:0 auto;max-width:460px}
.card-inner{position:relative;min-height:240px;transition:transform .5s;transform-style:preserve-3d}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:var(--sky-soft)}
.back{transform:rotateY(180deg)}
.word{font-size:clamp(34px,9vw,46px);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.art{display:inline-block;font-weight:700;margin-right:.25em}
.art.der{color:var(--der)}.art.die{color:var(--die)}.art.das{color:var(--das)}
.plural{color:var(--muted);font-size:16px;margin-top:6px}
.tr{font-family:var(--hand);font-size:40px;font-weight:700;color:var(--cobalt);line-height:1}
.ex{margin-top:12px;font-size:17px;max-width:32ch}
.ex-tr{margin:5px auto 0;color:var(--muted);font-size:15px;line-height:1.35;max-width:32ch}
.speak{margin-top:14px;border:2px solid var(--cobalt);background:transparent;color:var(--cobalt);border-radius:999px;padding:6px 14px;font-size:15px}
.flip-hint{margin-top:14px;color:var(--muted);font-size:14px}

.actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btn{border:none;border-radius:14px;padding:12px 20px;font-weight:700;font-size:17px;min-width:140px}
.btn.yes{background:var(--meadow);color:#fff}
.btn.no{background:var(--paper);color:var(--ink);border:2px solid var(--muted)}
.btn.next{background:var(--cobalt);color:#fff}

/* artikel */
.art-word{text-align:center;font-size:clamp(36px,10vw,52px);font-weight:700;margin:18px 0 6px;overflow-wrap:anywhere}
.art-tr{text-align:center;color:var(--muted);margin:0 0 18px}
.art-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto}
.art-btn{border:none;border-radius:16px;padding:16px 0;color:#fff;font-family:var(--hand);font-size:34px;font-weight:700;line-height:1}
.art-btn.der{background:var(--cobalt)}.art-btn.die{background:var(--poppy)}.art-btn.das{background:var(--meadow)}
.art-btn[disabled]{opacity:.35;cursor:default}
.art-btn.correct{opacity:1;outline:4px solid var(--sun)}

/* quiz */
.opts{display:grid;gap:10px;max-width:460px;margin:0 auto}
.opt{text-align:left;background:var(--sky-soft);border:2px solid transparent;border-radius:14px;padding:13px 16px;color:var(--ink);font-size:18px}
.opt.right{border-color:var(--meadow);background:#DDF5E8;color:#145C42}
.opt.wrong{border-color:var(--poppy);background:#FDE3DE;color:#8A1E10}

/* cat */
.cat-row{display:flex;align-items:flex-end;gap:10px;justify-content:center;margin-top:16px;min-height:72px}
.cat{width:70px;height:70px;flex:none}
.bubble{background:var(--paper);border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:6px 12px;font-family:var(--hand);font-size:24px;font-weight:700;line-height:1.1;max-width:260px}
.streak{position:absolute;top:12px;right:16px;font-family:var(--hand);font-size:22px;color:var(--cobalt);font-weight:700}

.legend{display:flex;gap:16px;justify-content:center;margin-top:26px;font-size:15px;color:var(--muted);flex-wrap:wrap}
.legend b.der{color:var(--der)}.legend b.die{color:var(--die)}.legend b.das{color:var(--das)}

</style>
</head>

const MIN_LAST_LESSON = 10;

if(LESSONS.length>1 && LESSONS[LESSONS.length-1].length<MIN_LAST_LESSON){
  const rest = LESSONS.pop();

}

let activeLessonIndex = null;

let lastWordId = null;
const KEY = "beyza-a1-v2";
const LEGACY_KEY = "beyza-a1-v1";
let state = load();

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && s.known){ if(!Array.isArray(s.wrong)) s.wrong=[]; return s; }
    const legacy = migrateLegacy(JSON.parse(localStorage.getItem(LEGACY_KEY)));
    if(legacy) return legacy;
  }catch(e){}
  return {known:[], seen:{}, best:0, wrong:[]};
}
/* v1 kayıtları sıra numarası tutuyordu (0, 1, 2…); bunları kalıcı "artikel|kelime" kimliklerine çevir */
function migrateLegacy(s){
  if(!s || !Array.isArray(s.known)) return null;
  const toId = n => DATA[n] ? DATA[n].id : null;
  const ids = arr => (Array.isArray(arr) ? arr : []).map(toId).filter(Boolean);
  const seen = {};
  for(const [n,count] of Object.entries(s.seen||{})){ const id = toId(+n); if(id) seen[id]=count; }
  return {known:ids(s.known), seen, best:s.best||0, wrong:ids(s.wrong)};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const stage = $("#stage");

function repeat(){

}

/* Bilinmeyenler öncelikli; az görülenler daha sık; az önce gösterilen kelime arka arkaya gelmez */
function nextWord(pool){
  const unknown = pool.filter(d=>!state.known.includes(d.id));
  let src = unknown.length ? unknown : pool;
  if(src.length>1) src = src.filter(d=>d.id!==lastWordId);
  const weighted = src.map(d=>({d, w:1/(1+(state.seen[d.id]||0))}));
  let r = Math.random()*weighted.reduce((s,x)=>s+x.w,0);
  let chosen = src[0];
  for(const x of weighted){ r-=x.w; if(r<=0){ chosen = x.d; break; } }
  lastWordId = chosen.id;
  return chosen;
}

let deVoice = null;
function loadVoice(){ if(!("speechSynthesis" in window)) return; deVoice = speechSynthesis.getVoices().find(v=>v.lang && v.lang.startsWith("de")) || null; }

function say(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang="de-DE"; u.rate=.9; if(deVoice) u.voice=deVoice;
  speechSynthesis.speak(u);
}

  const cardHeight = Math.max(240,205+exampleLines*24);
  stage.innerHTML = `
      ${activeMode==="repeat"?`<div class="lesson-card-status"><span>Tekrar · ${pool.length} yanlış kelime</span><button class="lesson-back" id="lessonBack" type="button">Dersler</button></div>`:activeLessonIndex===null?"":`<div class="lesson-card-status"><span>Ders ${activeLessonIndex+1}/${LESSONS.length} · ${lessonKnown}/${pool.length}</span><button class="lesson-back" id="lessonBack" type="button">Tüm dersler</button></div>${lessonKnown===pool.length?`<p class="lesson-complete">Bu ders tamamlandı; istersen tekrar çalışabilirsin.</p>`:""}`}
    <p class="hint">Karta dokun, arkasını gör. Bildiğin kelimeleri işaretle, bilmediklerin daha sık gelir.</p>
    <div class="card" id="card" role="button" tabindex="0" aria-label="Kartı çevir">
      <div class="card-inner" style="min-height:${cardHeight}px">
        <div class="face front">
          <div class="word">${wordHTML(d)}</div>
          ${d.pl?`<div class="plural">çoğul: ${esc(d.pl)}</div>`:""}
          <div class="flip-hint">dokun ve çevir</div>
        </div>
        <div class="face back">
          <div class="tr">${esc(d.tr)}</div>
          <div class="ex">${esc(d.ex)}</div>
          ${d.exTr?`<div class="ex-tr">${esc(d.exTr)}</div>`:""}
          <button class="speak" data-say="ex">🔊 Cümleyi dinle</button>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn no" id="no">Henüz değil</button>
      <button class="btn yes" id="yes">Biliyorum</button>
    </div>`;
  const card = $("#card");
  const lessonBack = $("#lessonBack");
  if(lessonBack) lessonBack.onclick = lessons;
  const flip = () => { card.classList.toggle("flipped"); if(card.classList.contains("flipped")) say(speakText(d)); };
  card.addEventListener("click", e => { if(e.target.closest(".speak")) return; flip(); });
  card.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); flip(); } });
  stage.querySelector(".speak").addEventListener("click", e => { e.stopPropagation(); say(d.ex); });
  $("#yes").onclick = () => {
    if(!state.known.includes(d.id)) state.known.push(d.id);
    state.wrong = state.wrong.filter(id=>id!==d.id);
    save(); renderProgress();
    if(activeMode==="repeat") activePool=activePool.filter(word=>word.id!==d.id);
    cards();
  };
  $("#no").onclick = () => { state.known = state.known.filter(x=>x!==d.id); save(); renderProgress(); cards(); };
}

/* ---------- der · die · das ---------- */
let streak = 0;
function artikel(){
  const d = nextWord(NOUNS);
  stage.innerHTML = `
    <span class="streak" title="Seri">seri ${streak} · en iyi ${state.best}</span>
    <p class="hint">Doğru artikeli seç.</p>
    <div class="art-word">${esc(d.w)}</div>
    <p class="art-tr">${esc(d.tr)}</p>
    <div class="art-btns">
      <button class="art-btn der" data-a="der">der</button>
      <button class="art-btn die" data-a="die">die</button>
      <button class="art-btn das" data-a="das">das</button>
    </div>
    <div id="fb"></div>`;
  stage.querySelectorAll(".art-btn").forEach(b => b.onclick = () => {
    const ok = b.dataset.a === d.art;
    state.seen[d.id]=(state.seen[d.id]||0)+1;
    stage.querySelectorAll(".art-btn").forEach(x => { x.disabled = true; if(x.dataset.a===d.art) x.classList.add("correct"); });
    if(ok){ streak++; if(streak>state.best) state.best=streak; } else streak=0;
    save();
    say(d.art+" "+d.w);
    $("#fb").innerHTML = catSays(ok ? pick(PRAISE) : `Fast! Es heißt <span class="art ${d.art}">${d.art}</span> ${esc(d.w)}.`) +
      `<div class="actions"><button class="btn next" id="nx">Sıradaki</button></div>`;
    stage.querySelector(".streak").textContent = `seri ${streak} · en iyi ${state.best}`;
    $("#nx").focus(); $("#nx").onclick = artikel;
  });
}

/* ---------- Quiz ---------- */
function quiz(){
  const pool = activeLessonIndex===null ? DATA : activePool;
  const d = nextWord(pool);
  const sameType = pool.filter(x=>x.type===d.type && x.id!==d.id && x.tr!==d.tr);
  const distractors = shuffle(sameType).slice(0,3);
  if(distractors.length<3){
    const fallback = pool.filter(x=>x.id!==d.id && x.tr!==d.tr && !distractors.some(y=>y.id===x.id));
    distractors.push(...shuffle(fallback).slice(0,3-distractors.length));
  }
  const opts = shuffle([d, ...distractors]);
  stage.innerHTML = `
    ${activeLessonIndex===null?"":`<div class="lesson-card-status"><span>Ders ${activeLessonIndex+1}/${LESSONS.length} · Quiz</span><button class="lesson-back" id="lessonQuizBack" type="button">Tüm dersler</button></div>`}
    <p class="hint">Bu kelimenin anlamı ne?</p>
    <div class="art-word">${wordHTML(d)}</div>
    <div style="text-align:center;margin-bottom:16px"><button class="speak" id="sp">🔊 Dinle</button></div>
    <div class="opts">${opts.map(o=>`<button class="opt" data-id="${esc(o.id)}">${esc(o.tr)}</button>`).join("")}</div>
    <div id="fb"></div>`;
  const lessonQuizBack = $("#lessonQuizBack");
  if(lessonQuizBack) lessonQuizBack.onclick = lessons;
  $("#sp").onclick = () => say(speakText(d));
  stage.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const ok = b.dataset.id === d.id;
    state.seen[d.id]=(state.seen[d.id]||0)+1;
    if(ok){
      if(!state.known.includes(d.id)) state.known.push(d.id);
      state.wrong = state.wrong.filter(id=>id!==d.id);
    }else if(!state.wrong.includes(d.id)){
      state.wrong.push(d.id);
    }
    save(); renderProgress();
    stage.querySelectorAll(".opt").forEach(x => { x.disabled = true; if(x.dataset.id===d.id) x.classList.add("right"); });
    if(!ok) b.classList.add("wrong");
    $("#fb").innerHTML = catSays(ok ? pick(PRAISE) : "Nicht schlimm! Nochmal.") +
      `<p class="ex" style="text-align:center;margin:10px auto 0">${esc(d.ex)}</p>` +
      (d.exTr ? `<p class="ex-tr" style="text-align:center">${esc(d.exTr)}</p>` : "") +
      `<div class="actions"><button class="btn next" id="nx">Sıradaki</button></div>`;
    $("#nx").focus(); $("#nx").onclick = quiz;
  });
}

const MODES = {lessons, cards, artikel, quiz, repeat};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  activeMode = t.dataset.mode;
  activeLessonIndex = null;
  activePool = DATA;
  if(activeMode==="repeat"){
    repeat();
    return;
  }
  selectTab(activeMode);
  MODES[t.dataset.mode]();
});
renderProgress();
lessons();

/* Tek dosyalık sürüm file:// ile açıldığında service worker kaydedilemez */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
}

</script>
